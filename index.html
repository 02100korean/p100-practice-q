<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>100 Korean Patterns Practice</title>
<meta name="description" content="Flashcards and quizzes for 100 Essential Korean Sentence Patterns for Beginners (Yoomi Song · O2BAEK).">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap">
<style>
:root{color-scheme:light;--ink:#2B2440;--acc:#D9776A;--acc2:#7A5BC4;--soft:#FBF1EA;--line:#EADFD6;--bg:#FFF9F3;--muted:#8A7F9A;--ok:#3E9B6E;--bad:#D2564A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;word-break:keep-all}
.wrap{width:100%;max-width:560px;padding:20px 18px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font-weight:800;font-size:15px;letter-spacing:.02em}
.brand small{display:block;font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.12em}
.sub{font-size:12px;font-weight:800;color:#fff;background:var(--acc);padding:8px 12px;border-radius:20px;text-decoration:none;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#fff;padding:5px;border-radius:14px;box-shadow:0 2px 10px rgba(60,40,80,.06)}
.tabs button{border:0;background:none;padding:10px 4px;border-radius:10px;font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.range{display:flex;gap:6px;overflow-x:auto;margin:14px 0 4px;padding-bottom:4px;scrollbar-width:none}
.range::-webkit-scrollbar{display:none}
.range button{flex:none;border:1.5px solid var(--line);background:#fff;padding:7px 12px;border-radius:20px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
.range button.on{border-color:var(--acc);background:var(--acc);color:#fff}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;margin:12px 2px 8px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.card{background:#fff;border-radius:20px;box-shadow:0 6px 22px rgba(60,40,80,.09);padding:24px 22px;min-height:300px;position:relative}
.num{font-size:13px;font-weight:800;color:var(--acc);letter-spacing:.08em}
.pat{font-size:23px;font-weight:800;line-height:1.35;margin-top:8px}
.slot{color:var(--acc)}
.hint{font-size:13px;color:var(--muted);margin-top:18px}
.flip{cursor:pointer;user-select:none}
.back .mean{font-size:15.5px;line-height:1.55;margin-top:12px}
.back .mean.en{color:var(--muted);font-size:14px;margin-top:4px}
.ex{margin-top:16px;background:var(--soft);border-radius:12px;padding:12px 14px}
.ex b{display:block;font-size:16.5px}
.ex span{display:block;font-size:13.5px;color:var(--muted);margin-top:3px}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:0;border-radius:14px;padding:15px 10px;font:inherit;font-size:15px;font-weight:800;cursor:pointer}
.btn.no{background:#fff;color:var(--bad);border:2px solid #F2C9C3}
.btn.yes{background:var(--ok);color:#fff}
.btn.main{background:var(--ink);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.vid{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:13px;font-weight:800;color:#fff;background:#E14B3B;padding:8px 12px;border-radius:10px;text-decoration:none}
.q{font-size:19px;font-weight:700;line-height:1.45;margin-top:10px}
.qsub{font-size:13px;color:var(--muted);margin-top:4px}
.answer{min-height:58px;border:2px dashed var(--line);border-radius:14px;margin-top:18px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:0;background:var(--soft);color:var(--ink);font:inherit;font-size:17px;font-weight:700;padding:10px 14px;border-radius:12px;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.answer .chip{background:#fff;border:2px solid var(--acc2);box-shadow:none}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font:inherit;font-size:16.5px;font-weight:700;color:var(--ink);cursor:pointer;line-height:1.4}
.opt.ok,.answer.ok{border-color:var(--ok);background:#EAF6EF}
.opt.bad,.answer.bad{border-color:var(--bad);background:#FCEDEB}
.fb{margin-top:14px;font-size:14.5px;font-weight:700;min-height:22px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.done{text-align:center;padding-top:30px}
.done .big{font-size:54px;font-weight:900;color:var(--acc)}
.foot{margin-top:28px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.7}
.foot a{color:var(--acc);font-weight:700;text-decoration:none}
.plink{background:none;border:0;padding:0;font:inherit;color:var(--acc2);font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.plink small{font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;margin-left:4px;display:inline-block}
.cta{margin-top:22px;background:#fff;border:2px solid var(--acc);border-radius:16px;padding:16px 18px;display:block;text-decoration:none;color:var(--ink)}
.cta b{color:var(--acc);font-size:15px}.cta span{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
</style>
</head>

<script>
const D = [{"n":1,"t":"[명사]은/는 [명사]입니다.","ko":"주어가 무엇인지 설명하거나 정의할 때 사용합니다. 주제(은/는)를 강조합니다.","en":"Used to describe or define the subject. It emphasizes the topic (은/는).","ex":[["저는 학생입니다.","I am a student."],["여기는 학교입니다.","This is a school."],["그 사람은 선생님입니다.","That person is a teacher."]],"v":"jACqkOk6Xmg"},{"n":2,"t":"[명사]이/가 [명사]입니다.","ko":"주어가 무엇인지 설명하거나 정의할 때 사용합니다. 주어를 강조합니다. @02100KOREAN","en":"Used to describe or define the subject, emphasizing the subject (이/가).","ex":[["제가 언니입니다.","I am the older sister."],["그 여자가 의사입니다.","That woman is a doctor."],["내 이름이 민수입니다.","My name is Min-su."]],"v":"x2OwSdNVkbc"},{"n":3,"t":"[명사]이/가 있습니다.","ko":"존재나 소유를 표현할 때 사용합니다.","en":"Used to express existence or possession.","ex":[["고양이가 있습니다.","There is a cat."],["시간이 있습니다.","I have time."],["책이 있습니다.","There is a book."]],"v":"Pd8GoH6-gww"},{"n":4,"t":"[명사]이/가 없습니다.","ko":"존재하지 않거나 소유하지 않을 때 사용합니다.","en":"Used to express non-existence or lack of possession.","ex":[["돈이 없습니다.","I don’t have money."],["여기에 사람이 없습니다.","There is no one here."],["시간이 없습니다.","I don’t have time."]],"v":"--aFzk_uDj8"},{"n":5,"t":"[동사]-고 싶습니다.","ko":"하고 싶은 일을 표현할 때 사용합니다.","en":"Used to express desire to do something.","ex":[["한국어를 배우고 싶습니다.","I want to learn Korean."],["여행을 가고 싶습니다.","I want to travel."],["책을 읽고 싶습니다.","I want to read a book."]],"v":"eIhLtXBUAJU"},{"n":6,"t":"[명사]하고 (같이) [동사].","ko":"다른 사람과 같이 어떤 일을 할 때 사용합니다.","en":"Used to do something with other people.","ex":[["친구하고 같이 커피를 마셨습니다.","I drank coffee with my friend."],["저분하고 같이 사진을 찍고 싶습니다.","I'd like to take a picture with him."],["오늘 친구들하고 만날 겁니다.","I'm going to meet with my friends today."]],"v":"xpwseMIuFMs"},{"n":7,"t":"[동사]-지 마십시오.","ko":"하지 말아야 할 일을 말할 때 사용합니다.","en":"Used to tell someone not to do something.","ex":[["여기에서 사진을 찍지 마십시오.","Don’t take pictures here."],["늦게 오지 마십시오.","Don’t be late."],["담배를 피우지 마십시오.","Don’t smoke."]],"v":"yT75OPbUzOk"},{"n":8,"t":"[동사]-아/어 주십시오.","ko":"부탁하거나 요청할 때 사용합니다.","en":"Used to make a request or ask for help.","ex":[["문을 열어 주십시오.","Please open the door."],["이것 좀 가르쳐 주십시오.","Please teach me this."],["사진을 찍어 주십시오.","Please take a picture."]],"v":"foYmMj37GMk"},{"n":9,"t":"[명사]에 갑니다.","ko":"목적지로 가는 것을 말할 때 사용합니다.","en":"Used to indicate going to a destination.","ex":[["학교에 갑니다.","I am going to school."],["집에 갑니다.","I am going home."],["회사에 갑니다.","I am going to work."]],"v":"PPXJYLaX8Jw"},{"n":10,"t":"[명사]에서 [동사].","ko":"특정 장소에서 어떤 행동을 할 때 사용합니다.","en":"Used to describe an action taking place at a specific location.","ex":[["도서관에서 공부합니다.","I study at the library."],["집에서 요리합니다.","I cook at home."],["공원에서 운동합니다.","I exercise in the park."]],"v":"IrQcAZwo3Qo"},{"n":11,"t":"[명사]에 있습니다.","ko":"특정 장소에 무엇이 있는지 말할 때 사용합니다.","en":"Used to indicate where something is located.","ex":[["가방이 방에 있습니다.","The bag is in the room."],["친구가 학교에 있습니다.","My friend is at school."],["고양이가 책상 위에 있습니다.","The cat is on the desk."]],"v":"cvYo5QK4x8g"},{"n":12,"t":"[명사]에 없습니다.","ko":"특정 장소에 무엇이 없는지 말할 때 사용합니다.","en":"Used to indicate where something is not located.","ex":[["사람이 집에 없습니다.","There is no one at home."],["열쇠가 가방에 없습니다.","The key is not in the bag."],["책이 테이블 위에 없습니다.","The book is not on the table."]],"v":"zGz4k7t9EuM"},{"n":13,"t":"[명사]은/는 [명사]에 있습니다.","ko":"주제(은/는)가 어디에 있는지 설명할 때 사용합니다.","en":"Used to describe the location of the topic.","ex":[["책은 책상 위에 있습니다.","The book is on the desk."],["저는 집에 있습니다.","I am at home."],["가방은 의자 옆에 있습니다.","The bag is next to the chair."]],"v":"QqGzCwbyrxM"},{"n":14,"t":"[명사]에서 [명사]까지","ko":"장소의 시작과 끝을 말할 때 사용합니다.","en":"Used to indicate the start and end of a location.","ex":[["서울에서 부산까지","From Seoul to Busan."],["지하철역에서 서점까지","From the subway station to the bookstore."],["집에서 학교까지","From home to school."]],"v":"0F3RMgZ29BE"},{"n":15,"t":"[명사]부터 [명사]까지","ko":"시간이나 범위의 시작과 끝을 말할 때 사용합니다.","en":"Used to indicate the beginning and end of a time or range.","ex":[["아침 9시부터 10시까지","From 9 a.m. to 10 a.m."],["어제부터 내일까지","from yesterday to tomorrow"],["16쪽부터 20쪽까지","pages 16 to 20"]],"v":"dsl7Ii3NcLA"},{"n":16,"t":"[동사]-고 있습니다.","ko":"현재 진행 중인 행동을 표현할 때 사용합니다.","en":"Used to express an action in progress.","ex":[["저는 책을 읽고 있습니다.","I am reading a book."],["친구가 전화를 하고 있습니다.","My friend is making a call."],["비가 내리고 있습니다.","It is raining."]],"v":"6uhkTMMrk6w"},{"n":17,"t":"[명사]도 [명사]입니다.","ko":"앞의 내용과 비슷한 사실을 추가할 때 사용합니다.","en":"Used to add similar information to the previous statement.","ex":[["저는 학생입니다. 친구도 학생입니다.","I am a student. My friend is also a student."],["이 음식은 맛있습니다. 저 음식도 맛있습니다.","This food is delicious. That food is also delicious."],["민수는 축구를 좋아합니다. 지영이도 축구를 좋아합니다.","Min-su likes soccer. Ji-young also likes soccer."]],"v":"BwZ_UgMCPBg"},{"n":18,"t":"[동사]-아/어야 합니다.","ko":"해야 할 일을 표현할 때 사용합니다.","en":"Used to express something that must be done.","ex":[["숙제를 해야 합니다.","I must do my homework."],["약을 먹어야 합니다.","I must take medicine."],["내일 일찍 일어나야 합니다.","I must wake up early tomorrow."]],"v":"nEuLiqmtL3Q"},{"n":19,"t":"[동사]-아/어도 됩니다.","ko":"허락이나 가능성을 표현할 때 사용합니다.","en":"Used to express permission or possibility.","ex":[["여기에 앉아도 됩니다.","You may sit here."],["문을 열어도 됩니다.","You may open the door."],["질문해도 됩니다.","You may ask a question."]],"v":"s5fqdyBYOnw"},{"n":20,"t":"[동사]-지 않아도 됩니다.","ko":"하지 않아도 되는 일을 말할 때 사용합니다.","en":"Used to express that something is not necessary.","ex":[["숙제를 하지 않아도 됩니다.","You don’t have to do homework."],["걱정하지 않아도 됩니다.","You don’t have to worry."],["오늘 학교에 가지 않아도 됩니다.","You don’t have to go to school today."]],"v":"Pa3tCp5W0hs"},{"n":21,"t":"[명사]을/를 [동사].","ko":"동사의 목적어를 나타낼 때 사용합니다.","en":"Used to indicate the object of the verb.","ex":[["저는 책을 읽습니다.","I read a book."],["친구를 만났습니다.","I met a friend."],["커피를 마십니다.","I drink coffee."]],"v":"46aJ1w-Qjs0"},{"n":22,"t":"[동사]/[형용사]-기 때문에 [결과].","ko":"원인과 결과를 말할 때 사용합니다.","en":"Used to describe cause and effect.","ex":[["날씨가 좋기 때문에 산책을 했습니다.","The weather is nice, so I took a walk."],["피곤하기 때문에 집에서 쉬었습니다.","I was tired, so I rested at home."],["길이 막혔기 때문에 늦었습니다.","I was late because of the traffic."]],"v":"dFvx_zsV1TE"},{"n":23,"t":"[동사]/[형용사]-아서/어서 [결과].","ko":"원인과 결과를 간단히 말할 때 사용합니다.","en":"A simpler way to express cause and effect.","ex":[["배가 고파서 밥을 먹었습니다.","I was hungry, so I ate."],["날씨가 추워서 옷을 많이 입었습니다.","It was cold, so I wore many clothes."],["숙제가 어려워서 선생님께 물어봤습니다.","The homework was hard, so I asked the teacher."]],"v":"1Tt56-ZvD58"},{"n":24,"t":"[명사]을/를 좋아합니다.","ko":"좋아하는 것을 표현할 때 사용합니다.","en":"Used to express likes.","ex":[["저는 음악을 좋아합니다.","I like music."],["친구는 영화를 좋아합니다.","My friend likes movies."],["민수는 축구를 좋아합니다.","Min-su likes soccer."]],"v":"sMcP5Fjwrp0"},{"n":25,"t":"[명사]을/를 싫어합니다.","ko":"싫어하는 것을 표현할 때 사용합니다.","en":"Used to express dislikes.","ex":[["저는 채소를 싫어합니다.","I dislike vegetables."],["친구는 비를 싫어합니다.","My friend dislikes rain."],["민수는 숙제를 싫어합니다.","Min-su dislikes homework."]],"v":"QaJY9SD7XSc"},{"n":26,"t":"[동사]-는 것을 좋아합니다.","ko":"좋아하는 행동을 표현할 때 사용합니다.","en":"Used to express liking an activity.","ex":[["저는 노래하는 것을 좋아합니다.","I like singing."],["친구는 여행하는 것을 좋아합니다.","My friend likes traveling."],["민수는 운동하는 것을 좋아합니다.","Min-su likes exercising."]],"v":"_LOrGGqbU2E"},{"n":27,"t":"[명사]을/를 가지고 있습니다.","ko":"소유를 표현할 때 사용합니다.","en":"Used to express possession.","ex":[["저는 책을 가지고 있습니다.","I have a book."],["친구는 자전거를 가지고 있습니다.","My friend has a bicycle."],["민수는 노트북을 가지고 있습니다.","Min-su has a laptop."]],"v":"uTy6IGqGMts"},{"n":28,"t":"[명사]이/가 필요합니다.","ko":"필요한 것을 표현할 때 사용합니다.","en":"Used to express necessity.","ex":[["저는 시간이 필요합니다.","I need time."],["친구는 도움이 필요합니다.","My friend needs help."],["민수는 돈이 필요합니다.","Min-su needs money."]],"v":"oVciwaLYQKE"},{"n":29,"t":"[동사]-고 싶지 않습니다.","ko":"하고 싶지 않은 것을 표현할 때 사용합니다.","en":"Used to express not wanting to do something.","ex":[["저는 공부하고 싶지 않습니다.","I don’t want to study."],["저는 일하고 싶지 않습니다.","I don’t want to work."],["저는 운동하고 싶지 않았습니다.","I didn’t want to exercise."]],"v":"Hp6Mn7C9O1M"},{"n":30,"t":"[명사]이/가 [명사]보다 [형용사]","ko":"비교를 표현할 때 사용합니다.","en":"Used to make comparisons.","ex":[["사과가 바나나보다 큽니다.","An apple is bigger than a banana."],["민수가 지영이보다 빠릅니다.","Min-su is faster than Ji-young."],["오늘이 어제보다 춥습니다.","Today is colder than yesterday."]],"v":"er-Qhriih2g"},{"n":31,"t":"[동사]-아/어 보십시오.","ko":"무언가를 시도하거나 권유할 때 사용합니다.","en":"Used to suggest or recommend trying something.","ex":[["이 음식을 드셔 보십시오.","Try eating this food."],["한국어를 공부해 보십시오.","Try studying Korean."],["한국에 와 보십시오.","Try visiting Korea."]],"v":"iQ70C69JD4U"},{"n":32,"t":"[동사]-기로 했습니다.","ko":"결심이나 약속을 표현할 때 사용합니다.","en":"Used to express a decision or a promise.","ex":[["저는 내일 운동하기로 했습니다.","I decided to exercise tomorrow."],["친구와 영화를 보기로 했습니다.","I decided to watch a movie with my friend."],["한국어를 열심히 공부하기로 했습니다.","I decided to study Korean hard."]],"v":"XtE3oK_m-Wc"},{"n":33,"t":"[동사]-려고 합니다.","ko":"계획이나 의도를 표현할 때 사용합니다.","en":"Used to express a plan or intention.","ex":[["저는 한국에 가려고 합니다.","I intend to go to Korea."],["친구와 만나려고 합니다.","I plan to meet my friend."],["오늘 저녁을 요리하려고 합니다.","I plan to cook dinner tonight."]],"v":"vrSkldhsbVI"},{"n":34,"t":"[동사]/[형용사]-아/어서 좋습니다.","ko":"특정 상황이나 행동이 마음에 들 때 사용합니다.","en":"Used to express satisfaction with a situation or action.","ex":[["날씨가 맑아서 좋습니다.","I like that the weather is clear."],["친구가 와서 좋습니다.","I’m glad my friend came."],["숙제를 끝내서 좋습니다.","I’m happy I finished my homework."]],"v":"n0em6da78jY"},{"n":35,"t":"[동사]-지 않을 겁니다.","ko":"앞으로 하지 않을 일을 표현할 때 사용합니다.","en":"Used to express something you won’t do in the future.","ex":[["저는 내일 학교에 가지 않을 겁니다.","I won’t go to school tomorrow."],["친구와 싸우지 않을 겁니다.","I won’t fight with my friend."],["그 영화를 보지 않을 겁니다.","I won’t watch that movie."]],"v":"9jvJHRw7JyU"},{"n":36,"t":"[동사]-지 않을 수 없습니다.","ko":"반드시 해야 하는 일을 강조할 때 사용합니다.","en":"Used to emphasize something that must be done.","ex":[["숙제를 하지 않을 수 없습니다.","I can’t avoid doing my homework."],["약속을 지키지 않을 수 없습니다.","I must keep my promise."],["일찍 일어나지 않을 수 없습니다.","I can’t avoid waking up early."]],"v":"7MJ-1OLYrKA"},{"n":37,"t":"[동사]-거나 [동사].","ko":"두 가지 선택 중 하나를 말할 때 사용합니다.","en":"Used to express one of two choices.","ex":[["집에서 쉬거나 친구를 만날 겁니다.","I will either rest at home or meet a friend."],["책을 읽거나 음악을 들을 겁니다.","I will either read a book or listen to music."],["여행을 가거나 집에서 쉴 겁니다.","I will either travel or rest at home."]],"v":"x8sleadEYg0"},{"n":38,"t":"[동사]-기 전에 [행동].","ko":"어떤 일이 발생하기 전에 다른 일을 할 때 사용합니다.","en":"Used to describe doing something before another event.","ex":[["밥을 먹기 전에 손을 씻으십시오.","Wash your hands before eating."],["잠자기 전에 책을 읽습니다.","I read a book before sleeping."],["출발하기 전에 준비하십시오.","Prepare before departing."]],"v":"DV0MOVY1Iuo"},{"n":39,"t":"[동사]-ㄴ/은 후에 [행동].","ko":"어떤 일이 끝난 후 다른 일을 할 때 사용합니다.","en":"Used to describe doing something after another event.","ex":[["숙제를 한 후에 놀 겁니다.","I will play after doing my homework."],["밥을 먹은 후에 산책했습니다.","I took a walk after eating."],["일을 끝낸 후에 집에 갔습니다.","I went home after finishing work."]],"v":"odeF32LjYMY"},{"n":40,"t":"[동사]-아/어서 [행동].","ko":"어떤 일을 하고 나서 다른 일을 할 때 사용합니다.","en":"Used to describe doing something and then another action.","ex":[["학교에 가서 공부했어요.","I went to school and studied."],["친구를 만나서 이야기를 나눴습니다.","I met my friend and talked."],["요리를 해서 먹었습니다.","I cooked and ate."]],"v":"nm9Nw_4drcY"},{"n":41,"t":"[동사]-는 동안 [행동]","ko":"어떤 일이 진행되는 동안 다른 일이 일어날 때 사용합니다.","en":"Used to describe one action occurring during another.","ex":[["제가 요리하는 동안 친구가 청소했습니다.","While I cooked, my friend cleaned."],["비가 오는 동안 집에 있었어요.","I stayed home while it was raining."],["수업 듣는 동안 메모를 했습니다.","I took notes while attending class."]],"v":"3tF7A6ZG2qM"},{"n":42,"t":"[명사]이/가 [동사]-고 싶어 하다","ko":"다른 사람이 특정 행동을 하고 싶어 할 때 사용합니다.","en":"Used to describe someone else wants to do a certain thing.","ex":[["미나는 영화를 보고 싶어 합니다.","Mi-na wants to watch a movie."],["친구가 여행을 가고 싶어 합니다.","My friend wants to travel."],["민수가 운동을 하고 싶어 합니다.","Min-su wants to exercise."]],"v":"tcWTEuh8sf0"},{"n":43,"t":"[명사]에 대해 [동사]","ko":"어떤 주제에 대해 이야기하거나 생각할 때 사용합니다.","en":"Used to talk or think about a topic.","ex":[["한국 문화에 대해 공부하고 있습니다.","I am studying about Korean culture."],["그 문제에 대해 생각 중입니다.","I am thinking about that issue."],["영화에 대해 이야기합시다.","Let’s talk about the movie."]],"v":"xG5KmyBY_B0"},{"n":44,"t":"[명사]을/를 위해 [동사]","ko":"특정 대상을 위해 행동할 때 사용합니다.","en":"Used to describe doing something for someone or something.","ex":[["가족을 위해 열심히 일합니다.","I work hard for my family."],["친구를 위해 선물을 준비했습니다.","I prepared a gift for my friend."],["회사를 위해 프로젝트를 만들었습니다.","I made a project for the company."]],"v":"m9ayKHT70mg"},{"n":45,"t":"[명사]만 [형용사]/[동사]/[명사]이다","ko":"다른 것은 제외하고 앞의 명사에 한정해서 말하거나 최소한의 수준을 말할 때 사용합니다.","en":"Used to limit what you say to the preceding noun, excluding everything else. It can also express a minimum amount.","ex":[["저는 당신만 사랑합니다.","I only love you."],["우리 반에서 선생님만 한국 사람입니다.","Only the teacher in my class is Korean."],["잠시만 기다려 주십시오.","Please wait a moment."]],"v":"yBxNy0vmfj0"},{"n":46,"t":"[동사]-ㄴ/은 적이 있습니다.","ko":"과거에 경험한 일을 말할 때 사용합니다.","en":"Used to describe an experience from the past.","ex":[["저는 한국에 간 적이 있습니다.","I have been to Korea."],["친구와 함께 영화를 본 적이 있습니다.","I have watched a movie with my friend."],["그 책을 읽은 적이 있습니다.","I have read that book."]],"v":"PypY3QfR8yE"},{"n":47,"t":"[동사]-ㄹ/을 수 있습니다.","ko":"할 수 있는 능력이나 가능성을 말할 때 사용합니다.","en":"Used to express ability or possibility.","ex":[["저는 자전거를 탈 수 있습니다.","I can ride a bicycle."],["친구가 저를 도울 수 있습니다.","My friend can help me."],["이 문제를 해결할 수 있습니다.","I can solve this problem."]],"v":"RBkKXYDmw78"},{"n":48,"t":"[동사]-ㄹ/을 수 없습니다.","ko":"할 수 없는 능력이나 불가능을 말할 때 사용합니다.","en":"Used to express inability or impossibility.","ex":[["저는 수영을 할 수 없습니다.","I cannot swim."],["오늘은 친구를 만날 수 없습니다.","I cannot meet my friend today."],["이 일을 혼자 할 수 없습니다.","I cannot do this work alone."]],"v":"9Yg_kTHFR5M"},{"n":49,"t":"[명사]이/가 되다","ko":"어떤 상태나 직업으로 변할 때 사용합니다.","en":"Used to describe becoming a state or a profession.","ex":[["저는 선생님이 되고 싶습니다.","I want to become a teacher."],["그 아이가 어른이 되었어요.","That child became an adult."],["우리는 친구가 되었어요.","We became friends."]],"v":"avZLqeZ_ICs"},{"n":50,"t":"[명사]과/와 달리","ko":"두 대상을 비교하여 서로 다른 점을 강조할 때 사용합니다.","en":"Used to compare two subjects and emphasize their differences.","ex":[["저는 동생과 달리 책 읽는 것을 좋아합니다.","Unlike my younger sibling, I like reading books."],["이 가방은 다른 가방과 달리 아주 가볍습니다.","Unlike other bags, this bag is very light."],["그는 저와 달리 매우 활동적입니다.","Unlike me, he is very active."]],"v":"tE_8JmOQ1-g"},{"n":51,"t":"[동사]-ㄴ/은 지 [시간] 됐습니다.","ko":"어떤 일이 시작된 후 경과된 시간을 표현할 때 사용합니다.","en":"Used to express the time elapsed since an action began.","ex":[["한국어를 배운 지 1년 됐습니다.","It has been one year since I started learning Korean."],["친구를 만난 지 오래됐습니다.","It has been a long time since I met my friend."],["결혼한 지 5년 됐습니다.","It has been 5 years since I got married."]],"v":"z_nTd16Dfuo"},{"n":52,"t":"[명사]이/가 [형용사]-아/어 보입니다.","ko":"무언가가 어떻게 보이는지 표현할 때 사용합니다.","en":"Used to describe how something appears.","ex":[["그 사람이 행복해 보입니다.","That person looks happy."],["이 음식이 맛있어 보입니다.","This food looks delicious."],["아이가 아파 보입니다.","The child looks sick."]],"v":"_Belp1_v91M"},{"n":53,"t":"[명사]마다 [행동]","ko":"반복적으로 일어나는 일을 표현할 때 사용합니다.","en":"Used to describe something that happens repeatedly.","ex":[["주말마다 친구를 만납니다.","I meet my friend every weekend."],["날마다 운동을 합니다.","I exercise every day."],["집마다 크기가 다릅니다.","Each house is a different size."]],"v":"ky2e4hoaWTU"},{"n":54,"t":"[명사] 덕분에 [결과]","ko":"좋은 결과의 원인을 표현할 때 사용합니다.","en":"Used to express the reason for a good result.","ex":[["선생님 덕분에 시험을 잘 봤습니다.","Thanks to the teacher, I did well on the test."],["날씨 덕분에 여행이 즐거웠습니다.","Thanks to the weather, the trip was enjoyable."],["친구 덕분에 문제가 해결됐습니다.","Thanks to my friend, the problem was solved."]],"v":"U6u77oWPAQ8"},{"n":55,"t":"[명사] 때문에 [결과]","ko":"어떤 결과의 원인을 표현할 때 사용합니다. 나쁜 결과의 원인을 표현할 수도 있습니다.","en":"Used to express the cause of an outcome. You can also express the cause of a bad outcome.","ex":[["당신 때문에 매일 행복합니다.","I'm happy every day because of you."],["비 때문에 축구를 못 했습니다.","Because of the rain, I couldn’t play soccer."],["감기 때문에 집에 있었습니다.","I stayed home because of a cold."]],"v":"D1BVLcA0QG0"},{"n":56,"t":"[동사]/[형용사]-ㄹ/을 때 [행동]","ko":"특정 시점에서 다른 행동을 말할 때 사용합니다.","en":"Used to describe an action at a specific time.","ex":[["비가 올 때 우산을 쓰십시오.","Use an umbrella when it rains."],["공부할 때 음악을 듣습니다.","I listen to music when I study."],["아플 때는 병원에 가십시오.","Go to the hospital when you’re sick."]],"v":"4gnrCzYMoeA"},{"n":57,"t":"[동사]-는 중입니다.","ko":"현재 어떤 일이 진행 중임을 표현할 때 사용합니다.","en":"Used to describe an action that is in progress.","ex":[["저는 책을 읽는 중입니다.","I am reading a book."],["친구가 전화를 하는 중입니다.","My friend is making a phone call."],["우리는 숙제를 하는 중입니다.","We are doing homework."]],"v":"CjSD4y5EZkA"},{"n":58,"t":"[동사]-아/어도 괜찮습니다.","ko":"허락을 표현할 때 사용합니다.","en":"Used to express permission.","ex":[["여기 앉아도 괜찮습니다.","You may sit here."],["문을 열어도 괜찮습니다.","You may open the door."],["사진을 찍어도 괜찮습니다.","You may take a picture."]],"v":"1DpefR7sncY"},{"n":59,"t":"[동사]-면/으면 안 됩니다.","ko":"금지나 허용되지 않는 일을 표현할 때 사용합니다.","en":"Used to express prohibition.","ex":[["여기에서 담배를 피우면 안 됩니다.","You must not smoke here."],["거짓말을 하면 안 됩니다.","You must not lie."],["늦게 오면 안 됩니다.","You must not come late."]],"v":"M8NyXJh5ge0"},{"n":60,"t":"[동사]-ㄹ/을까 합니다.","ko":"계획이나 의도를 약하게 표현할 때 사용합니다.","en":"Used to softly express a plan or intention.","ex":[["내일 영화를 볼까 합니다.","I’m thinking of watching a movie tomorrow."],["여행을 갈까 합니다.","I’m considering going on a trip."],["저녁을 집에서 먹을까 합니다.","I’m thinking of eating dinner at home."]],"v":"6w6cHH9x0Fg"},{"n":61,"t":"[명사]이/가 아니라 [명사]입니다.","ko":"잘못된 정보를 수정하거나 올바른 정보를 제공할 때 사용합니다.","en":"Used to correct misinformation or provide accurate information.","ex":[["저는 학생이 아니라 회사원입니다.","I am not a student but an office worker."],["이것은 제 것이 아니라 친구 것입니다.","This is not mine but my friend’s."],["그 사람은 의사가 아니라 간호사입니다.","That person is not a doctor but a nurse."]],"v":"95apPv6afbo"},{"n":62,"t":"[동사]-아/어야겠습니다.","ko":"어떤 행동이 필요하거나 해야 할 때 사용합니다.","en":"Used to express necessity or obligation.","ex":[["내일 일찍 일어나야겠습니다.","I should wake up early tomorrow."],["숙제를 빨리 끝내야겠습니다.","I must finish my homework quickly."],["건강을 위해 운동해야겠습니다.","I should exercise for my health."]],"v":"v3jpRdQdlHs"},{"n":63,"t":"[동사]-러/으러 갑니다/옵니다.","ko":"이동의 목적을 표현할 때 사용합니다.","en":"Used to express the purpose of movement.","ex":[["어제 돈을 찾으러 은행에 갔습니다.","I went to the bank yesterday to pick up the money."],["영화를 보러 극장에 갈 겁니다.","I'm going to the theater to see a movie."],["서류를 제출하러 왔습니다.","I'm here to submit the documents."]],"v":"s8QH-2Y5eZE"},{"n":64,"t":"[명사]밖에 [동사]-지 않습니다. / [명사]밖에 없습니다.","ko":"제한된 선택이나 소량을 표현할 때 사용합니다.","en":"Used to express a limited choice or quantity.","ex":[["저는 물밖에 마시지 않습니다.","I only drink water."],["가방에 책밖에 없습니다.","There is only a book in the bag."],["시간이 10분밖에 없습니다.","There are only 10 minutes left."]],"v":"qcDUmux95qQ"},{"n":65,"t":"[동사]/[형용사]-ㄹ/을 때마다 [행동]","ko":"특정 행동이 반복될 때마다 다른 행동이 이어질 때 사용합니다.","en":"Used to describe actions that occur every time another action happens.","ex":[["그 노래를 들을 때마다 눈물이 납니다.","I cry every time I hear that song."],["날씨가 추울 때마다 감기에 걸립니다.","I catch a cold every time it’s cold."],["친구를 만날 때마다 기분이 좋습니다.","I feel happy every time I meet my friend."]],"v":"-gTpH8AV4Uc"},{"n":66,"t":"[명사]이/가 [명사]로/으로 바뀌었습니다.","ko":"무언가가 변화했을 때 사용합니다.","en":"Used to describe a change in something.","ex":[["물이 얼음으로 바뀌었습니다.","Water turned into ice."],["회사가 새로운 이름으로 바뀌었습니다.","The company changed its name."],["방이 더 밝은 색으로 바뀌었습니다.","The room was changed to a brighter color."]],"v":"OxKfiChQ7A8"},{"n":67,"t":"[동사]-ㄹ/을 수밖에 없습니다.","ko":"선택의 여지가 없을 때 사용합니다.","en":"Used to express that there is no other option.","ex":[["이 일을 끝낼 수밖에 없습니다.","I have no choice but to finish this work."],["그 제안을 받아들일 수밖에 없었습니다.","I had no choice but to accept the offer."],["오늘은 집에서 쉴 수밖에 없습니다.","I have no choice but to rest at home today."]],"v":"oAed9mV-NvA"},{"n":68,"t":"[명사]이/가 [명사]만큼 [형용사]","ko":"두 대상을 비교하여 비슷한 정도를 나타낼 때 사용합니다.","en":"Used to compare two things to show similar levels.","ex":[["이 집이 저 집만큼 큽니다.","This house is as big as that house."],["제 동생이 저만큼 공부를 열심히 합니다.","My younger sibling studies as hard as I do."],["이 음식이 그 음식만큼 맛있습니다.","This food is as delicious as that food."]],"v":"rt5peihttDc"},{"n":69,"t":"[동사]-(으)면서 [동사]","ko":"두 가지 행동이 동시에 일어날 때 사용합니다.","en":"Used to describe two actions happening at the same time.","ex":[["음악을 들으면서 공부합니다.","I study while listening to music."],["친구와 이야기하면서 커피를 마셨습니다.","I drank coffee while talking to my friend."],["텔레비전을 보면서 저녁을 먹었습니다.","I ate dinner while watching TV."]],"v":"kRQRl0jlYtw"},{"n":70,"t":"[동사]-는 것 같습니다. (현재) / [동사]-ㄴ/은 것 같습니다. (과거) / [형용사]-ㄴ/은 것 같습니다. / [명사]인 것 같습니다.","ko":"추측이나 의견을 말할 때 사용합니다.","en":"Used to express a guess or opinion.","ex":[["비가 오는 것 같습니다.","It seems like it’s raining."],["그는 피곤한 것 같습니다.","He seems tired."],["이 영화가 재미있는 것 같습니다.","This movie seems interesting."]],"v":"S7toooOgbP4"},{"n":71,"t":"[명사]이/가 [동사]-기 시작했습니다.","ko":"어떤 행동이 시작되었음을 나타낼 때 사용합니다.","en":"Used to indicate the start of an action.","ex":[["비가 오기 시작했습니다.","It started to rain."],["아이가 걷기 시작했습니다.","The child started walking."],["3개월 전에 한국어를 배우기 시작했습니다.","I started learning Korean 3 months ago."]],"v":"bwI1aQru3GU"},{"n":72,"t":"[명사]처럼 [형용사]/[동사]","ko":"어떤 것이 다른 것과 비슷한 상황을 나타낼 때 사용합니다.","en":"Used to indicate a situation in which something is similar to another.","ex":[["날씨가 여름처럼 덥습니다.","The weather is hot like summer."],["그 사람이 연예인처럼 유명해졌습니다.","That person has become famous like a celebrity."],["제 친구는 가수처럼 노래를 잘합니다.","My friend sings well like a singer."]],"v":"3heyQvV78O8"},{"n":73,"t":"[동사]-기 어렵습니다/쉽습니다.","ko":"어떤 일이 어렵거나 쉬운 정도를 표현할 때 사용합니다.","en":"Used to describe the difficulty or ease of an action.","ex":[["이 문제는 풀기 어렵습니다.","This problem is difficult to solve."],["한국어는 배우기 쉽습니다.","Korean is easy to learn."],["요리는 배우기 어렵지 않습니다.","Cooking is not hard to learn."]],"v":"NfWfa-rWPrg"},{"n":74,"t":"[동사]-지 않으면 안 됩니다.","ko":"꼭 해야 하는 일을 강조할 때 사용합니다.","en":"Used to emphasize something that must be done.","ex":[["숙제를 하지 않으면 안 됩니다.","You must do your homework."],["약속을 지키지 않으면 안 됩니다.","You must keep your promise."],["건강을 위해 운동하지 않으면 안 됩니다.","You must exercise for your health."]],"v":"w6EHvV-sxVI"},{"n":75,"t":"[동사]-고 나서 [행동]","ko":"어떤 일을 끝낸 후 다음 행동을 표현할 때 사용합니다.","en":"Used to describe an action done after completing another.","ex":[["숙제를 하고 나서 TV를 봤습니다.","I watched TV after doing my homework."],["밥을 먹고 나서 설거지를 했습니다.","I did the dishes after eating."],["책을 읽고 나서 잠을 잤습니다.","I slept after reading a book."]],"v":"Zt4j68hO8iM"},{"n":76,"t":"[명사]에 따라 [결과]","ko":"어떤 조건이나 상황에 따른 결과를 표현할 때 사용합니다.","en":"Used to describe results depending on a condition or situation.","ex":[["날씨에 따라 계획이 달라질 수 있습니다.","Plans may change depending on the weather."],["사람에 따라 생각이 다릅니다.","Thoughts differ depending on the person."],["가격에 따라 품질이 다릅니다.","Quality varies depending on the price."]],"v":"wBVYk5vEx0Q"},{"n":77,"t":"[동사]-기로 마음먹었습니다.","ko":"어떤 결심이나 의도를 확고히 할 때 사용합니다.","en":"Used to express firm determination.","ex":[["한국어를 배우기로 마음먹었습니다.","I decided to learn Korean."],["담배를 끊기로 마음먹었습니다.","I decided to quit smoking."],["열심히 공부하기로 마음먹었습니다.","I decided to study hard."]],"v":"1L8j976NOEs"},{"n":78,"t":"[명사]이/가 중요합니다.","ko":"어떤 것이 중요성을 가지고 있음을 표현할 때 사용합니다.","en":"Used to describe the importance of something.","ex":[["건강이 제일 중요합니다.","Health is the most important thing."],["약속이 중요합니다.","Promises are important."],["시간 관리가 중요합니다.","Time management is important."]],"v":"tGkcQ9xfHDE"},{"n":79,"t":"[동사]-는 법을 배웁니다.","ko":"특정 행동을 배우는 것을 표현할 때 사용합니다.","en":"Used to describe learning how to do something.","ex":[["저는 요리하는 법을 배웠습니다.","I learned how to cook."],["운전하는 법을 배우고 있습니다.","I’m learning how to drive."],["기타 치는 법을 배우고 싶습니다.","I want to learn how to play the guitar."]],"v":"yWSRhl9CHDI"},{"n":80,"t":"[동사]-ㄴ/은 지 얼마 안 됐습니다.","ko":"어떤 일이 시작된 지 오래되지 않았음을 표현할 때 사용합니다.","en":"Used to describe that not much time has passed since starting something x":[["다음 달에 여행을 갈 계획입니다.","I plan to travel next month."],["새로운 프로젝트를 시작할 계획입니다.","I plan to start a new project."],["내년에 한국어를 더 열심히 공부할 계획입니다.","I plan to study Korean harder next year."]],"v":"38AckZaZWNg"},{"n":93,"t":"[동사]-기만 합니다.","ko":"특정 행동만 한다는 것을 강조할 때 사용합니다.","en":"Used to emphasize doing only a specific action.","ex":[["아이는 울기만 했습니다.","The child only cried."],["그는 공부만 합니다.","He only studies."],["우리는 기다리기만 했습니다.","We only waited."]],"v":"O6ymml2oLT8"},{"n":94,"t":"[명사]을/를 대신해 [동사]","ko":"다른 사람을 대신하여 행동할 때 사용합니다.","en":"Used to describe acting on behalf of someone else.","ex":[["친구를 대신해 숙제를 해 줬습니다.","I did the homework on behalf of my friend."],["부모님을 대신해 서류를 제출했습니다.","I submitted the documents on behalf of my parents."],["팀을 대신해 발표를 했습니다.","I made the presentation on behalf of the team."]],"v":"Qvd8x2y0sN4"},{"n":95,"t":"[명사]에 의하면 [결과]","ko":"출처나 근거를 나타낼 때 사용합니다.","en":"Used to indicate the source or basis of information.","ex":[["뉴스에 의하면 오늘 비가 올 겁니다.","According to the news, it will rain today."],["조사에 의하면 결과가 긍정적입니다.","According to the survey, the result is positive."],["전문가에 의하면 이 제품이 최고입니다.","According to experts, this product is the best."]],"v":"XzEh2dy6woc"},{"n":96,"t":"[명사]이/가 보입니다.","ko":"눈에 보이는 상태를 표현할 때 사용합니다.","en":"Used to describe something that is visible.","ex":[["산이 멀리 보입니다.","The mountain is visible in the distance."],["별이 하늘에 보입니다.","Stars are visible in the sky."],["자막이 잘 안 보입니다.","I can't see the subtitles well."]],"v":"RVSn6OLTnB0"},{"n":97,"t":"[동사]-지 않게 [동사]","ko":"어떤 일이 일어나지 않도록 막을 때 사용합니다.","en":"Used to prevent something from happening.","ex":[["실수를 하지 않게 주의하십시오.","Be careful not to make a mistake."],["아이가 울지 않게 달래 줬습니다.","I comforted the child so he wouldn’t cry."],["사람들이 불편해하지 않게 준비했습니다.","I prepared so that people wouldn’t feel uncomfortable."]],"v":"seCN9pX9Gnc"},{"n":98,"t":"[동사]-지 않을 이유가 없습니다.","ko":"어떤 일이 일어날 가능성을 강하게 표현할 때 사용합니다.","en":"Used to strongly indicate the likelihood of something happening.","ex":[["이 계획이 성공하지 const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = t => t.replace(/\[(명사|동사|형용사|결과|행동|시간)\]/g, '<span class="slot">[$1]</span>');
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const RANGES = [[1, 100, 'All']].concat([0, 1, 2, 3, 4].map(i => [i * 20 + 1, i * 20 + 20, (i * 20 + 1) + '–' + (i * 20 + 20)]));
let ret = null;
let mode = 'cards', range = store.get('range', 0), deck = [], idx = 0, score = 0, known = store.get('known', {});

function buildRange() {
  $('#range').innerHTML = RANGES.map((r, i) => `<button class="${i === range ? 'on' : ''}" data-r="${i}">${r[2]}</button>`).join('');
  $('#range').querySelectorAll('button').forEach(b => b.onclick = () => { ret = null; range = +b.dataset.r; store.set('range', range); buildRange(); start(); });
}
function pats() { const [a, b] = RANGES[range]; return D.filter(p => p.n >= a && p.n <= b); }
function setProg() { $('#prog').style.width = (deck.length ? idx / deck.length * 100 : 0) + '%'; $('#count').textContent = Math.min(idx + 1, deck.length) + ' / ' + deck.length; }

function start() {
  idx = 0; score = 0;
  const P = pats();
  if (mode === 'cards') { $('#mode-name').textContent = 'Tap the card to flip'; deck = shuffle(P); }
  else {
    const all = []; P.forEach(p => p.ex.forEach(e => all.push({ p, ko: e[0], en: e[1] })));
    deck = shuffle(all).slice(0, mode === 'order' ? 10 : 10);
    $('#mode-name').textContent = mode === 'order' ? 'Put the words in order' : 'Choose the right Korean';
  }
  render();
}

function render() {
  setProg();
  if (idx >= deck.length) return finish();
  if (mode === 'cards') return renderCard();
  if (mode === 'order') return renderOrder();
  renderMatch();
}

function renderCard() {
  const p = deck[idx]; let flipped = !!ret;
  const front = `<div class="num">PATTERN ${String(p.n).padStart(2, '0')}${known[p.n] ? ' · ✓' : ''}</div><div class="pat">${fmt(p.t)}</div><div class="hint">Do you know what it means? Tap to check →</div>`;
  const back = `<div class="num">PATTERN ${String(p.n).padStart(2, '0')}</div><div class="pat" style="font-size:19px">${fmt(p.t)}</div>
    <div class="back"><div class="mean">${p.ko}</div><div class="mean en">${p.en}</div></div>
    <div class="ex"><b>${p.ex[0][0]}</b><span>${p.ex[0][1]}</span></div>
    <a class="vid" href="https://youtu.be/${p.v}" target="_blank" rel="noopener">▶ Watch the video</a>`;
  $('#stage').innerHTML = `<div class="card flip" id="c">${flipped ? back : front}</div>
    ${ret ? '<div class="row"><button class="btn main" id="back">← Back to quiz</button></div>' : '<div class="row"><button class="btn no" id="no">Not yet</button><button class="btn yes" id="yes">I know it</button></div>'}`;
  $('#c').onclick = e => { if (e.target.closest('a')) return; flipped = !flipped; $('#c').innerHTML = flipped ? back : front; };
  if (ret) { $('#back').onclick = backToQuiz; return; }
  $('#no').onclick = () => { delete known[p.n]; store.set('known', known); deck.push(p); idx++; render(); };
  $('#yes').onclick = () => { known[p.n] = 1; store.set('known', known); score++; idx++; render(); };
}

function openCard(n, answered) {
  ret = { mode, deck, idx, score, answered };
  deck = [D.find(p => p.n === n)]; idx = 0; mode = 'cards';
  $('#mode-name').textContent = 'Review this pattern'; $('#count').textContent = '';
  renderCard(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function backToQuiz() {
  ({ mode, deck, idx, score } = ret); const a = ret.answered; ret = null;
  if (a) idx++;
  $('#mode-name').textContent = mode === 'order' ? 'Put the words in order' : 'Choose the right Korean';
  render();
}
const plink = (n, t) => `<button class="plink" data-n="${n}">Pattern ${n}: ${fmt(t)}</button><small>(click to review)</small>`;
const bindLinks = answered => document.querySelectorAll('.plink').forEach(b => b.onclick = () => openCard(+b.dataset.n, answered));

function renderOrder() {
  const it = deck[idx];
  const words = it.ko.replace(/[.?!]$/, '').split(/\s+/);
  const end = (it.ko.match(/[.?!]$/) || [''])[0];
  let pool = words.length > 1 ? shuffle(words.map((w, i) => ({ w, i }))) : words.map((w, i) => ({ w, i }));
  if (words.length > 1 && pool.every((x, k) => x.i === k)) pool.reverse();
  const picked = [];
  $('#stage').innerHTML = `<div class="card"><div class="num">PATTERN ${String(it.p.n).padStart(2, '0')}</div>
    <div class="q">${it.en}</div><div class="qsub">${plink(it.p.n, it.p.t)}</div>
    <div class="answer" id="ans"></div><div class="pool" id="pool"></div><div class="fb" id="fb"></div></div>
    <div class="row"><button class="btn ghost" id="reset">Reset</button><button class="btn main" id="check">Check</button></div>`;
  const draw = () => {
    $('#ans').innerHTML = picked.map((x, k) => `<button class="chip" data-k="${k}">${x.w}</button>`).join('');
    $('#pool').innerHTML = pool.map((x, k) => `<button class="chip" data-k="${k}">${x.w}</button>`).join('');
    $('#ans').querySelectorAll('.chip').forEach(b => b.onclick = () => { pool.push(picked.splice(+b.dataset.k, 1)[0]); draw(); });
    $('#pool').querySelectorAll('.chip').forEach(b => b.onclick = () => { picked.push(pool.splice(+b.dataset.k, 1)[0]); draw(); });
  };
  draw(); bindLinks(false);
  $('#reset').onclick = () => { pool = pool.concat(picked.splice(0)); draw(); };
  $('#check').onclick = () => {
    if (pool.length) { $('#fb').className = 'fb bad'; $('#fb').textContent = 'Use all the words.'; return; }
    const ok = picked.map(x => x.w).join(' ') === words.join(' ');
    $('#ans').className = 'answer ' + (ok ? 'ok' : 'bad');
    $('#fb').className = 'fb ' + (ok ? 'ok' : 'bad');
    $('#fb').innerHTML = ok ? 'Correct! 잘했어요! 👏' : 'Answer: ' + it.ko;
    if (ok) score++;
    bindLinks(true);
    $('#check').textContent = 'Next →'; $('#check').onclick = () => { idx++; render(); };
    $('#reset').style.display = 'none';
  };
}

function renderMatch() {
  const it = deck[idx];
  const others = shuffle(D.flatMap(p => p.ex.map(e => e[0])).filter(s => s !== it.ko)).slice(0, 3);
  const opts = shuffle([it.ko].concat(others));
  $('#stage').innerHTML = `<div class="card"><div class="num">WHAT'S THE KOREAN?</div><div class="q">${it.en}</div>
    <div class="opts">${opts.map(o => `<button class="opt">${o}</button>`).join('')}</div><div class="fb" id="fb"></div></div>
    <div class="row"><button class="btn main" id="next" style="visibility:hidden">Next →</button></div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if ($('#next').style.visibility === 'visible') return;
    const ok = b.textContent === it.ko; if (ok) score++;
    document.querySelectorAll('.opt').forEach(x => { if (x.textContent === it.ko) x.classList.add('ok'); });
    if (!ok) b.classList.add('bad');
    $('#fb').className = 'fb ' + (ok ? 'ok' : 'bad');
    $('#fb').innerHTML = ok ? `Correct! 잘했어요! 👏 <span style="color:var(--muted);font-weight:600">· Pattern ${it.p.n}: ${fmt(it.p.t)}</span>`
      : `Not quite. Review the pattern:<div style="margin-top:6px">${plink(it.p.n, it.p.t)}</div>`;
    bindLinks(true);
    $('#next').style.visibility = 'visible';
  });
  $('#next').onclick = () => { idx++; render(); };
}

function finish() {
  $('#prog').style.width = '100%';
  const total = mode === 'cards' ? pats().length : deck.length;
  const msg = mode === 'cards' ? `You know ${Object.keys(known).filter(n => pats().some(p => p.n == n)).length} of ${pats().length} patterns!` : `${score} / ${deck.length} correct`;
  $('#stage').innerHTML = `<div class="card done"><div class="big">${mode === 'cards' ? '🎉' : score + '/' + deck.length}</div>
    <div class="q" style="margin-top:12px">${msg}</div><div class="qsub" style="margin-top:8px">Say each sentence out loud. Write it by hand. Make your own sentences!</div>
    <div class="row" style="margin-top:26px"><button class="btn main" id="again">Practice again</button></div></div>`;
  $('#again').onclick = start;
}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  ret = null; mode = b.dataset.m; start();
});
buildRange(); start();
</script>
</body>
</html>
